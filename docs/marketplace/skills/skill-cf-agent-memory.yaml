id: skill-cf-agent-memory
name: Cloudflare Agent Memory
description: >-
  Use Cloudflare Agent Memory as VOLY remote memory backend
  (memory.backend=agent_memory) for shared remember/recall across sessions.
source: marketplace
status: active
version: 0.1.0
content: |
  ## When to use
  - Memory must survive machine switches / team shared profile.
  - Local SQLite alone is not enough.

  ## Enable
  ```yaml
  memory:
    enabled: true
    backend: agent_memory
    agent_memory_account_id: "${CF_ACCOUNT_ID}"
    agent_memory_namespace: voly-prod
    agent_memory_profile_mode: project
    agent_memory_profile: default  # only used when mode: explicit
    agent_memory_checkpoint_ingest: true
    agent_memory_checkpoint_max_bytes: 32000
  ```
  ```bash
  export CF_ACCOUNT_ID=...
  export CLOUDFLARE_API_TOKEN=...  # Agent Memory permissions
  npx wrangler agent-memory namespace create voly-prod
  voly memory status --cwd /path/to/project
  voly memory summary --cwd /path/to/project
  ```

  ## Notes
  - Dual persistence: local SQLite + remote `/ingest` checkpoints and `/recall`.
  - Alternative: backend=hybrid + CF_WORKER_MEMORY_URL (D1/Vectorize Worker).
  - Project mode derives an isolated profile from cwd and fails closed without cwd.
  - Successful Pipeline/A2A checkpoints use bounded `/ingest`; local history survives remote failure.
  - Use explicit mode only for an intentional shared user/team/org profile.
  - Manual conversation ingestion is available via `voly memory ingest`.
  - See the Cloudflare Agent Memory HTTP API and namespace/profile docs.
