[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voly"
version = "0.1.0"
description = "Open-source control plane for routing, orchestrating, budgeting, and verifying AI coding agents"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Maksim Lanies", email = "dev@voly.codes" },
]
keywords = ["ai", "agent", "orchestration", "llm", "context", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://voly.codes"
Documentation = "https://github.com/voly-codes/voly#readme"
Repository = "https://github.com/voly-codes/voly"
Issues = "https://github.com/voly-codes/voly/issues"
Changelog = "https://github.com/voly-codes/voly/releases"

[project.optional-dependencies]
proxy = [
    "headroom-ai[proxy]>=0.27.0",
]
semantic = [
    "sentence-transformers>=2.0.0",
]
cursor = [
    "cursor-sdk>=0.1.0",
]
dspy = [
    "dspy>=2.5.0",
]
ui = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
]
# Serve VOLY as an MCP server (`voly mcp serve`) so MCP hosts — Cloudflare OS,
# Claude Desktop — can start and follow runs. Pulls in `ui` because starting a
# run reuses the dispatch path in voly/web/routes/run.py.
mcp = [
    "voly[ui]",
    "mcp>=2.0.0",
]
dev = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
all = [
    "voly[proxy,semantic,cursor,dspy,ui,mcp,dev]",
]

[project.scripts]
voly = "voly.cli.main:main"

[tool.setuptools]
packages = [
    "voly",
    "voly.a2a",
    "voly.agui",
    "voly.ai_gateway",
    "voly.catalog",
    "voly.capability",
    "voly.capability.schemas",
    "voly.capability.seeds",
    "voly.cli",
    "voly.cli.commands",
    "voly.cloudflare",
    "voly.config",
    "voly.dspy",
    "voly.dspy.programs",
    "voly.evidence",
    "voly.evaluation",
    "voly.executor",
    "voly.headroom",
    "voly.hooks",
    "voly.inference",
    "voly.intelligence",
    "voly.learning",
    "voly.mcp",
    "voly.memory",
    "voly.models",
    "voly.pipeline",
    "voly.plan",
    "voly.pxpipe",
    "voly.registry",
    "voly.research",
    "voly.reuse",
    "voly.rtk",
    "voly.runner",
    "voly.runtime",
    "voly.scanner",
    "voly.sdk",
    "voly.sensing",
    "voly.sensing.connectors",
    "voly.spend",
    "voly.tools",
    "voly.web",
    "voly.web.routes",
    "voly.workflow",
    # voly.web.auth removed: authentication is a closed Team-tier feature (voly-cloud)
]

[tool.setuptools.package-data]
"voly.capability" = ["seeds/*.yaml", "schemas/*.json", "benchmark_suite_v1.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["voly"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
pythonpath = ["."]
