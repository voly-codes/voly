name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        run: npm install --global openwiki

      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENWIKI_MODEL_ID: gpt-5.6-terra

      - name: Create OpenWiki update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Maksim Lanies"
          git config user.email "dev@voly.codes"
          git fetch origin openwiki/update:refs/remotes/origin/openwiki/update || true
          git checkout -B openwiki/update
          git add -- openwiki AGENTS.md CLAUDE.md .github/workflows/openwiki-update.yml
          if git diff --cached --quiet; then
            echo "OpenWiki is already current."
            exit 0
          fi
          git commit -m "docs: update OpenWiki"
          git push --force-with-lease origin HEAD:openwiki/update
          if ! gh pr view openwiki/update --json url >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head openwiki/update \
              --title "docs: update OpenWiki" \
              --body "Automated OpenWiki documentation update."
          fi
